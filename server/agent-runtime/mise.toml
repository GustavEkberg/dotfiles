[settings]
npm.package_manager = "pnpm"

[tools]
node = "24.18.0"
bun = "1.3.14"
pnpm = "11.9.0"
"npm:@opencode/cli" = { version = "2.2.6", allow_builds = ["@opencode/cli"] }

[tools."npm:@tobilu/qmd"]
version = "2.5.3"
# Build allowlist published by QMD 2.5.3 for its native dependencies.
allow_builds = [
  "better-sqlite3",
  "esbuild",
  "node-llama-cpp",
  "tree-sitter-go",
  "tree-sitter-javascript",
  "tree-sitter-python",
  "tree-sitter-rust",
  "tree-sitter-typescript",
]
